name: update-formula

on:
  schedule:
    - cron: '0 6 * * *'  # every day at 06:00 UTC
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update formula, generate digest and create PR if needed
        run: |
          set -e

          DIGEST=$(shasum Formula/xml2rfc.rb | cut -c1-8)
          NEW_BRANCH="update/xml2rfc-$DIGEST"

          git config --global user.name "metanorma-ci"
          git config --global user.email "metanorma-ci@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${{ secrets.METANORMA_CI_PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin

          # Find latest open PR branch matching pattern
          BRANCH=$(gh pr list --state open --json headRefName,updatedAt \
            --jq '[.[] | select(.headRefName | startswith("update/xml2rfc-")) | {name: .headRefName, updated: .updatedAt}] | sort_by(.updated) | reverse | .[0].name')

          if [ -n "$BRANCH" ]; then
            echo "Using existing branch with open PR: $BRANCH"
            git checkout -b "$BRANCH" "origin/$BRANCH"
          else
            echo "No matching open PR found. Creating new branch: $NEW_BRANCH"
            BRANCH="$NEW_BRANCH"
            git checkout -b "$BRANCH"
          fi

          # Re-run the update process to regenerate changes on this branch
          cd updater
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python main.py
          cd ..

          git add Formula/xml2rfc.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update xml2rfc formula ($DIGEST)"
            git push -u origin "$BRANCH"

            PR_EXISTS=$(gh pr list --head "$BRANCH" --json number --jq 'length')
            if [ "$PR_EXISTS" -eq 0 ]; then
              gh pr create \
                --title "Update xml2rfc formula" \
                --body "This PR updates the xml2rfc formula based on automated changes." \
                --base main \
                --head "$BRANCH"
            else
              echo "PR already exists for $BRANCH."
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

